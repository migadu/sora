openapi: 3.0.3
info:
  title: Sora Mail User API
  description: |
    REST API for user mailbox access via HTTP, providing a modern alternative to IMAP/POP3 protocols.
    Features stateless JWT-based authentication for web and mobile clients.
  version: 1.0.0
  contact:
    name: Sora Mail Support
    url: https://github.com/migadu/sora

servers:
  - url: /user
    description: User API version 1

tags:
  - name: Authentication
    description: JWT authentication and token management
  - name: Mailboxes
    description: Mailbox management operations
  - name: Messages
    description: Message retrieval and management
  - name: Filters
    description: Sieve filter management

paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate user
      description: Authenticate with email and password to receive a JWT token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: secret123
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT access token
                  expires_at:
                    type: string
                    format: date-time
                    description: Token expiration timestamp
                  account_id:
                    type: integer
                    format: int64
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh JWT token
      description: Exchange an existing valid token for a new one
      operationId: refreshToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: New JWT access token
                  expires_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /mailboxes:
    get:
      tags:
        - Mailboxes
      summary: List all mailboxes
      description: Retrieve all mailboxes for the authenticated user with message counts
      operationId: listMailboxes
      security:
        - bearerAuth: []
      parameters:
        - name: subscribed
          in: query
          description: Filter to only subscribed mailboxes
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of mailboxes
          content:
            application/json:
              schema:
                type: object
                properties:
                  mailboxes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Mailbox'
                  count:
                    type: integer
                    description: Number of mailboxes in the list.
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Mailboxes
      summary: Create new mailbox
      description: Create a new mailbox for the authenticated user
      operationId: createMailbox
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Archive/2024
      responses:
        '201':
          description: Mailbox created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  mailbox:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Mailbox already exists

  /mailboxes/{name}:
    delete:
      tags:
        - Mailboxes
      summary: Delete mailbox
      description: Delete a mailbox (INBOX cannot be deleted)
      operationId: deleteMailbox
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MailboxName'
      responses:
        '200':
          description: Mailbox deleted successfully
        '400':
          description: Cannot delete INBOX
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /mailboxes/{name}/subscribe:
    post:
      tags:
        - Mailboxes
      summary: Subscribe to mailbox
      description: Mark a mailbox as subscribed
      operationId: subscribeMailbox
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MailboxName'
      responses:
        '200':
          description: Subscribed successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /mailboxes/{name}/unsubscribe:
    post:
      tags:
        - Mailboxes
      summary: Unsubscribe from mailbox
      description: Mark a mailbox as unsubscribed
      operationId: unsubscribeMailbox
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MailboxName'
      responses:
        '200':
          description: Unsubscribed successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /mailboxes/{name}/messages:
    get:
      tags:
        - Messages
      summary: List messages in mailbox
      description: Retrieve messages from a specific mailbox with pagination
      operationId: listMessages
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MailboxName'
        - name: limit
          in: query
          description: Maximum number of messages to return
          schema:
            type: integer
            default: 50
            maximum: 1000
        - name: offset
          in: query
          description: Number of messages to skip
          schema:
            type: integer
            default: 0
        - name: unseen
          in: query
          description: Return only unseen messages
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    nullable: true
                    description: The matching messages, or null when there are none.
                    items:
                      $ref: '#/components/schemas/Message'
                  total:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /mailboxes/{name}/search:
    get:
      tags:
        - Messages
      summary: Search messages in mailbox
      description: Full-text search across messages in a mailbox
      operationId: searchMessages
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MailboxName'
        - name: q
          in: query
          description: Search query
          required: true
          schema:
            type: string
        - name: from
          in: query
          description: Filter by sender email
          schema:
            type: string
        - name: subject
          in: query
          description: Filter by subject
          schema:
            type: string
        - name: unseen
          in: query
          description: Only unseen messages
          schema:
            type: boolean
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    nullable: true
                    description: The matching messages, or null when there are none.
                    items:
                      $ref: '#/components/schemas/Message'
                  total:
                    type: integer
                    description: Number of messages in this response.
                  truncated:
                    type: boolean
                    description: |
                      `true` when more messages matched than were returned. The response
                      holds the newest `limit` matches.
                  limit:
                    type: integer
                    description: Most messages a search returns.
                    example: 100
                  query:
                    type: string
                    description: The `q` parameter.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /messages/{id}:
    get:
      tags:
        - Messages
      summary: Get message details
      description: |
        Retrieve a message's metadata in JSON. The body is not included: use
        /messages/{id}/body or /messages/{id}/raw.
      operationId: getMessage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: Message details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Messages
      summary: Update message flags
      description: >-
        Add or remove flags from a message. Additions are applied before removals;
        a flag listed in both arrays is removed.
      operationId: updateMessage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                add_flags:
                  type: array
                  items:
                    $ref: '#/components/schemas/SettableFlag'
                  example: ['\Seen', '\Flagged']
                remove_flags:
                  type: array
                  items:
                    $ref: '#/components/schemas/SettableFlag'
                  example: ['\Draft']
      responses:
        '200':
          description: |
            Flags updated. `data` is the message as GET /messages/{id} returns it. If
            the message cannot be read back after the update, `data` is left out and
            `id` is sent instead.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Message flags updated successfully
                  data:
                    $ref: '#/components/schemas/Message'
                  id:
                    type: integer
                    format: int64
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Messages
      summary: Delete message
      description: Mark message as deleted and expunge
      operationId: deleteMessage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: Message deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /messages/{id}/body:
    get:
      tags:
        - Messages
      summary: Get message body
      description: Retrieve message body in text or HTML format
      operationId: getMessageBody
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MessageId'
        - name: format
          in: query
          description: Preferred format
          schema:
            type: string
            enum: [text, html]
            default: html
      responses:
        '200':
          description: Message body
          content:
            text/plain:
              schema:
                type: string
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /messages/{id}/raw:
    get:
      tags:
        - Messages
      summary: Get raw message
      description: Retrieve message in RFC822 format
      operationId: getMessageRaw
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: Raw RFC822 message
          content:
            message/rfc822:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /filters:
    get:
      tags:
        - Filters
      summary: List Sieve filters
      description: Retrieve all Sieve filter scripts for the user
      operationId: listFilters
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of filters
          content:
            application/json:
              schema:
                type: object
                properties:
                  scripts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Filter'
                  count:
                    type: integer
                    description: Number of scripts in the list.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /filters/{name}:
    get:
      tags:
        - Filters
      summary: Get filter script
      description: Retrieve a specific Sieve filter script
      operationId: getFilter
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FilterName'
      responses:
        '200':
          description: Filter script content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Filters
      summary: Create or update filter
      description: Create a new Sieve filter or update an existing one
      operationId: putFilter
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FilterName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterRequest'
      responses:
        '200':
          description: The stored script, whether it was created or replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A new script would exceed the limit of 100 scripts per account
        '413':
          description: The script is larger than `max_script_size`

    delete:
      tags:
        - Filters
      summary: Delete filter
      description: Delete a Sieve filter script
      operationId: deleteFilter
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FilterName'
      responses:
        '200':
          description: Filter deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /filters/{name}/activate:
    post:
      tags:
        - Filters
      summary: Activate filter
      description: Set a filter script as the active script
      operationId: activateFilter
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FilterName'
      responses:
        '200':
          description: Filter activated successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /filters/capabilities:
    get:
      tags:
        - Filters
      summary: Get Sieve capabilities
      description: Retrieve supported Sieve extensions and capabilities
      operationId: getCapabilities
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sieve capabilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  extensions:
                    type: array
                    items:
                      type: string
                    example: ["fileinto", "vacation", "regex", "envelope"]
                  max_script_size:
                    type: integer
                    description: Maximum script size in bytes
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /user/auth/login

  parameters:
    MailboxName:
      name: name
      in: path
      required: true
      description: Mailbox name (URL encoded)
      schema:
        type: string
      example: INBOX

    MessageId:
      name: id
      in: path
      required: true
      description: Message ID
      schema:
        type: integer
        format: int64

    FilterName:
      name: name
      in: path
      required: true
      description: Filter script name
      schema:
        type: string
      example: spam-filter

  schemas:
    Mailbox:
      type: object
      description: |
        `total`, `unseen`, `uid_next` and `uid_validity` are what IMAP STATUS reports as
        MESSAGES, UNSEEN, UIDNEXT and UIDVALIDITY. All four are 0 for a shared mailbox
        the user may list but not read (ACL right `l` without `r`).
      properties:
        name:
          type: string
          example: INBOX
        path:
          type: string
          example: INBOX
        subscribed:
          type: boolean
        total:
          type: integer
          description: Number of messages in the mailbox.
          example: 142
        unseen:
          type: integer
          description: Number of messages without the `\Seen` flag.
          example: 5
        uid_next:
          type: integer
          format: int64
          description: |
            The UID the next message added to the mailbox will get (RFC 9051 §2.3.1.1).
            It changes whenever a message is added, even one expunged afterwards, so a
            client can poll it to notice new mail.
          example: 143
        uid_validity:
          type: integer
          format: int64
          description: |
            The mailbox's UIDVALIDITY. UIDs and `uid_next` can only be compared with
            earlier values while it stays the same.
          example: 1234567890

    SettableFlag:
      type: string
      description: |
        A system flag, written with its backslash as in IMAP: `\Seen`, `\Answered`,
        `\Flagged`, `\Deleted` or `\Draft`, in any case. `\Recent` cannot be set or
        cleared. Anything without a backslash is an IMAP keyword such as `$Forwarded`
        or `Work`, and must be a valid IMAP atom (RFC 9051 §9). A system flag name
        without its backslash (`Seen`) is rejected with 400 rather than taken as a
        keyword.
      example: '\Seen'

    SystemFlags:
      type: array
      nullable: true
      description: System flags set on the message, with their backslash; null when none are set.
      items:
        type: string
        enum: ['\Seen', '\Answered', '\Flagged', '\Deleted', '\Draft']
      example: ['\Seen']

    CustomFlags:
      type: array
      description: |
        IMAP keywords set on the message, without a backslash. Omitted when there
        are none.
      items:
        type: string
      example: ['$Forwarded', 'Work']

    Message:
      type: object
      description: |
        A message as the message list, the search and GET /messages/{id} return it.
        Addresses are bare email addresses from the message's headers, without display
        names. The body is not included: GET /messages/{id}/body and
        /messages/{id}/raw return it.
      properties:
        id:
          type: integer
          format: int64
          description: The message's ID in the /messages/{id} endpoints.
          example: 12345
        uid:
          type: integer
          format: int64
          description: The message's IMAP UID in its mailbox.
          example: 142
        mailbox_id:
          type: integer
          format: int64
          description: ID of the mailbox holding the message.
          example: 7
        mailbox_path:
          type: string
          description: Full name of the mailbox holding the message.
          example: INBOX
        subject:
          type: string
          example: Meeting Tomorrow
        from:
          type: string
          description: The first address of the From header; empty when there is none.
          example: boss@example.com
        to:
          type: array
          nullable: true
          description: The addresses of the To header; null when there are none.
          items:
            type: string
          example: ['user@example.com']
        cc:
          type: array
          description: The addresses of the Cc header. Omitted when there are none.
          items:
            type: string
          example: ['team@example.com']
        bcc:
          type: array
          description: |
            The addresses of the Bcc header, which normally only a message the user
            sent still carries. Omitted when there are none.
          items:
            type: string
        date:
          type: string
          format: date-time
          description: The Date header; the internal date when the message has none.
          example: '2024-01-20T10:30:00Z'
        internal_date:
          type: string
          format: date-time
          description: |
            When the message was delivered or appended (IMAP INTERNALDATE). The
            message list and the search are sorted by it, newest first.
          example: '2024-01-20T10:30:05Z'
        size:
          type: integer
          description: Size of the raw message in octets.
          example: 4096
        flags:
          $ref: '#/components/schemas/SystemFlags'
        custom_flags:
          $ref: '#/components/schemas/CustomFlags'
        message_id:
          type: string
          description: |
            The Message-ID header, without angle brackets. A message delivered without
            one has an ID Sora generated, in angle brackets.
          example: abc123@example.com
        in_reply_to:
          type: string
          description: |
            The message IDs of the In-Reply-To header, without angle brackets and
            separated by spaces. Omitted when there are none.
        references:
          type: string
          description: |
            The message IDs of the References header, without angle brackets and
            separated by spaces. Only GET /messages/{id} and the PATCH response send
            it; message list and search entries never do. Omitted when there are none.
        content_hash:
          type: string
          description: |
            BLAKE3 hash of the raw message, hex-encoded. Messages with the same content
            have the same hash.
        has_attachments:
          type: boolean
          description: |
            Whether the message has attachments, from the RFC 9979 keywords Sora sets
            on delivery and on APPEND: `true` for `$hasattachment`, `false` for
            `$hasnoattachment`. Omitted when the message carries neither, which is
            mail stored before Sora set them, or mail it could not inspect (such as
            encrypted mail).

    Filter:
      type: object
      description: |
        A Sieve script. GET /filters/{name} and PUT /filters/{name} send all four
        fields; the list (GET /filters) leaves out `script`.
      properties:
        name:
          type: string
          example: spam-filter
        script:
          type: string
          description: The script's source. Not sent in the list.
          example: |
            require ["fileinto"];
            if header :contains "Subject" "[SPAM]" {
              fileinto "Junk";
            }
        active:
          type: boolean
          description: Whether delivery runs this script. At most one script is active.
        updated_at:
          type: string
          format: date-time
          description: When the script was last stored.
          example: '2024-01-15T10:00:00Z'

    FilterRequest:
      type: object
      required:
        - script
      properties:
        script:
          type: string
          description: |
            The Sieve script's source, at most `max_script_size` bytes. It must compile
            against the extensions GET /filters/capabilities reports, or the request is
            refused with 400 and nothing is stored.
          example: |
            require ["fileinto"];
            if header :contains "Subject" "[SPAM]" {
              fileinto "Junk";
            }

  responses:
    BadRequest:
      description: Bad request - invalid input
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

    Unauthorized:
      description: Unauthorized - invalid or missing JWT token
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Invalid or expired token

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Resource not found
