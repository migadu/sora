# Proxy-only configuration (no database required)

[logging]
format = "console"
level = "info"

# Database section can be omitted when running proxy-only
# with remote_lookup
[database]

# No S3 needed for proxies
[s3]

# IMAP Proxy with remote_lookup
[[server]]
type = "imap_proxy"
name = "imap-proxy"
addr = ":1143"
remote_addrs = ["backend1.example.com:143"]
# The proxy logs in to the backend as the user with these master SASL credentials;
# they must match master_sasl_username/master_sasl_password on the backends.
master_sasl_username = "proxyuser"
master_sasl_password = "proxypass"

[server.remote_lookup]
enabled = true
url = "https://auth-api.example.com/lookup?email=$email"  # https:// is required for any host but localhost/loopback
lookup_local_users = false  # Critical: must be false to skip database
timeout = "5s"
